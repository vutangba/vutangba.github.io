<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Dự Án | Vũ Tăng Ba</title>
    <link rel="icon" type="image/png" href="assets/img/conrua.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary-color: #004d99; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; }
        
        .header-simple { padding: 60px 0; background: white; border-bottom: 1px solid #eee; margin-bottom: 40px; }
        
        /* Hiệu ứng thẻ dự án tối giản */
        .project-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            margin-bottom: 30px;
            aspect-ratio: 16 / 10; /* Giữ tỉ lệ khung hình đều nhau */
            cursor: pointer;
        }

        .project-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s;
            opacity: 0.8;
        }

        /* Lớp phủ tên dự án */
        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: white;
            transition: 0.3s;
        }

        .project-item:hover img {
            transform: scale(1.1);
            opacity: 1;
        }

        .project-item:hover .project-overlay {
            padding-bottom: 30px;
        }

        .project-name { font-size: 1.25rem; font-weight: bold; margin: 0; }
        
        footer { padding: 40px 0; color: #999; font-size: 0.9rem; }
        
        .btn-home { color: var(--primary-color); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header-simple text-center">
        <div class="container">
            <a href="index.html" class="btn-home mb-3 d-inline-block"><i class="fas fa-arrow-left"></i> Quay lại trang chủ</a>
            <h1 class="fw-bold">DANH MỤC DỰ ÁN</h1>
            <p class="text-muted">Nhấn vào từng dự án để xem nội dung chi tiết</p>
        </div>
    </div>

    <div class="container">
        <div class="row" id="project-grid">

            <div class="col-md-6 col-lg-4">
                <a href="du-an-rubik.html" class="text-decoration-none">
                    <div class="project-item shadow">
                        <img src="https://via.placeholder.com/600x400?text=Robot+Rubik+3x3" alt="Robot Rubik">
                        <div class="project-overlay">
                            <p class="project-name text-uppercase">Robot Giải Rubik 3x3</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a href="du-an-plc.html" class="text-decoration-none">
                    <div class="project-item shadow">
                        <img src="https://via.placeholder.com/600x400?text=Hệ+Thống+PLC+ATS" alt="PLC ATS">
                        <div class="project-overlay">
                            <p class="project-name text-uppercase">Hệ Thống PLC & ATS</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a href="du-an-moi.html" class="text-decoration-none">
                    <div class="project-item shadow">
                        <img src="https://via.placeholder.com/600x400?text=Đề+Tài+Mới" alt="Project">
                        <div class="project-overlay">
                            <p class="project-name text-uppercase">Tên Đề Tài Mới</p>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>

    <footer class="text-center">
        <p>&copy; 2026 Vũ Tăng Ba - Portfolio Kỹ Thuật</p>
    </footer>

    <script>
        // Chặn F12
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false;
        };
    </script>
</body>
</html>
