<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Dự Án</title>
    
    <link rel="icon" type="image/png" href="assets/img/conrua.jpg">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
    
        :root { 
            --primary-color: #004d99; 
            --secondary-color: #0073e6;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f8f9fa; 
            color: #333; 
        }
        

        .project-header { 
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); 
            color: white; 
            padding: 80px 0; 
            margin-bottom: 50px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

 
        .project-item {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            margin-bottom: 30px;
            aspect-ratio: 16 / 10;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: none;
        }

        .project-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0.85;
        }

    
        .project-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 25px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: white;
            transition: 0.3s;
        }

        .project-item:hover img {
            transform: scale(1.08);
            opacity: 1;
        }

        .project-name { 
            font-size: 1.2rem; 
            font-weight: 700; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        footer { 
            background: #333; 
            color: #ccc; 
            padding: 40px 0; 
            margin-top: 60px; 
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <header class="project-header text-center">
        <div class="container">
            <h1 class="display-5 fw-bold">DANH MỤC DỰ ÁN</h1>
            <p class="lead opacity-75">Tổng hợp các nghiên cứu và sản phẩm kỹ thuật tiêu biểu</p>
        </div>
    </header>

    <div class="container">
        <div class="row">

            <div class="col-md-6 col-lg-4">
                <a href="du-an/Rubik-solution.html" class="text-decoration-none">
                    <div class="project-item">
                        <img src="img/Rubik/Rubik.jpg" alt="Rubik's Cube Robot">
                        <div class="project-overlay">
                            <p class="project-name">Robot Giải Rubik 3x3</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a href="du-an/phan-loai-mau.html" class="text-decoration-none">
                    <div class="project-item">
                        <img src="img/phan-loai-mau-sac/Phan-loai-mau.jpg" alt="Phân loại màu">
                        <div class="project-overlay">
                            <p class="project-name">Mô phỏng hệ thống phân loại màu</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-6 col-lg-4">
                <a href="du-an/truyen-thong-nhiet-do.html" class="text-decoration-none">
                    <div class="project-item">
                        <img src="img/truyen-thong-nhiet/truyen-thong-nhiet-do.jpg" alt="Truyền thông điều khiển nhiệt độ">
                        <div class="project-overlay">
                            <p class="project-name">Mô phỏng hệ thống truyền thông nhiệt độ</p>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>

    <footer class="text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Vũ Tăng Ba - Engineering Portfolio</p>
        </div>
    </footer>

    <script>
        // Bảo mật code: Chặn chuột phải và phím tắt F12
        document.onkeydown = function(e) {
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) || (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) return false;
        };
    </script>
</body>
</html>
